##### **2.7: Create `data` Folder and Upload JSON Files**

1. Click "**Add file**" → "**Upload files**"
2. Create a folder called `data` on your computer
3. Put all your JSON files in it:
   - exercises_detailed_20.json
   - knee_arthritis_education.json
   - knee_arthritis_qa.json
   - knee_arthritis_patients.json
   - knee_arthritis_safety.json
   - knee_arthritis_progressions.json
4. Drag the entire `data` folder into GitHub's upload area
5. Click "**Commit changes**"

**OR** create each JSON file manually:

1. Click "**Add file**" → "**Create new file**"
2. **Name:** `data/exercises_detailed_20.json`
3. Copy-paste the JSON content
4. Click "**Commit changes**"
5. Repeat for all 6 JSON files

